auth:
  login_path: "/users/v1/login"
  token_response_key: "auth_token"

  accounts:
    admin:
      username: "admin"
      password: "pass1"
    user_a:
      username: "name1"
      password: "pass1"
    user_b:
      username: "name2"
      password: "pass2"

credential_check:
  enabled: true
  password_field: "password"        # nom du champ mot de passe dans le corps
  path_indicators:                  # mots qui trahissent un endpoint credential
    - "password"
    - "passwd"
    - "credential"