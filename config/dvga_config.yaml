auth:
  # Query pour identifier l'attaquant (oracles GraphQL BOLA).
  # %s est remplacé par le jeton. Défaut si absent : { me(token: "%s") { id } } (forme DVGA)
  # Type d'authentification : "rest" ou "graphql"
  type: "graphql"

  # Pour GraphQL : le nom de la mutation de login et le champ du token
  login_mutation: "login"
  token_field: "accessToken"

  accounts:
    admin:
      username: "admin"
      password: "changeme"
    user_a:
      username: "attaquant"
      password: "test123"
    user_b:
      username: "attaquant"
      password: "test123"