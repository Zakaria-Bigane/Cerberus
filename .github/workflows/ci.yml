# ─────────────────────────────────────────────────────────────────────────────
# CI Cerberus — tests, lint et audit de dépendances.
# Conçu pour tourner sur une machine vierge : aucun laboratoire (VAmPI/DVGA)
# n'est requis, les tests utilisent des faux clients HTTP et des JWT fabriqués.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sécurité du workflow lui-même : le jeton GITHUB_TOKEN est en LECTURE SEULE
# par défaut ; seuls les jobs qui en ont besoin l'élèvent ponctuellement.
permissions:
  contents: read

jobs:
  # ── 1. Tests unitaires sur plusieurs versions de Python ────────────────────
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]   # Python 3.9 EOL: not available on current GitHub runners
    steps:
      - name: Checkout (action épinglée par commit SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer pytest + couverture
        run: pytest tests/

      - name: Publier coverage.xml comme artefact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: coverage-xml
          path: coverage.xml

  # ── 2. Linting (Ruff) ───────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer Ruff
        run: pip install ruff==0.17.1

      - name: "Ruff check (config: ruff.toml)"
        run: ruff check .

  # ── 3. Audit des dépendances (chaîne d'approvisionnement) ──────────────────
  audit:
    name: Audit des dépendances (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Auditer requirements.txt contre les advisories PyPA
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --no-deps
