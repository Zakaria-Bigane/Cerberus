# ─────────────────────────────────────────────────────────────────────────────
# CD Cerberus — publication automatique sur PyPI à chaque tag sémantique.
# Modèle "GitHub as release manager" : on pousse un tag vX.Y.Z, le pipeline
# construit, vérifie et publie le paquet. test.pypi.org d'abord (job testpypi),
# puis PyPI réel seulement si l'environnement protégé `pypi-publish` approuve.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v*.*.*"   # ex : v1.0.0 — déclencheur unique des livraisons

permissions: {}   # refus par défaut ; chaque job n'élève que ce qu'il faut

jobs:
  # ── 1. Build + tests sur la version qui sera publiée ───────────────────────
  build-and-test:
    name: Build & Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (action épinglée par commit SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Vérifier la cohérence du tag avec pyproject.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Le tag v$TAG ne correspond pas à la version $VERSION de pyproject.toml."
            exit 1
          fi
          echo "Version cohérente : $VERSION"

      - name: Installer les dépendances de dev et lancer les tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest tests/

      - name: Linter (Ruff) avant publication
        run: ruff check .

      - name: Construire le paquet (sdist + wheel)
        run: |
          pip install "build==1.3.0" "twine==6.2.0"
          python -m build
          twine check dist/*
          echo "--- Contenu de l'artefact 'dist' uploadé ---"
          ls -la dist/
          for f in dist/*.whl; do
            python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); n=[x for x in z.namelist() if x.endswith('METADATA')][0]; print(sys.argv[1], '->', repr(z.read(n)[:80]))" "$f"
          done

      - name: Publier les artefacts comme pièce jointe de la release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  # ── 1bis. GitHub Release en brouillon, dès que le build passe ──────────────
  # La release est créée en BROUILLON avant toute publication : elle reste
  # privée/invisible tant que PyPI n'a pas été approuvé, puis est publiée
  # automatiquement à la fin du pipeline.
  github-release-draft:
    name: Préparer la GitHub Release (brouillon)
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write    # nécessaire pour créer une release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Récupérer les artefacts construits
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Créer la release en brouillon avec notes automatiques
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090  # v2.4.1
        with:
          generate_release_notes: true
          draft: true
          files: |
            dist/*

  # ── 2. Publication d'essai sur TestPyPI (validation bout-en-bout) ──────────
  testpypi:
    name: Publication d'essai (TestPyPI)
    needs: build-and-test
    runs-on: ubuntu-24.04
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
    environment: testpypi
    permissions:
      contents: read
      id-token: write   # indispensable au trusted publishing (OIDC)
      actions: read     # requis par les environements proteges (approbation manuelle)
    steps:
      - name: Checkout du tag (build local, remplace le transit d'artefacts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Reconstruire les distributions localement (bit-identiques)
        run: |
          pip install --quiet "build==1.3.0" "twine==6.2.0"
          rm -rf dist/
          python -m build
          # Vérification d'intégrité AVANT publication : le wheel doit contenir
          # une METADATA valide (Name/Version). twine check est l'outil de référence.
          twine check dist/*
          python - <<'PYCHK'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          meta = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".dist-info/METADATA")]
          assert meta, f"METADATA absente dans {whl}"
          head = zipfile.ZipFile(whl).read(meta[0])[:120].decode()
          assert "Name:" in head and "Version:" in head, f"METADATA invalide: {head!r}"
          print("Integrite OK:", whl)
          PYCHK
          ls -la dist/

      - name: Publier sur TestPyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@f7600683efdcb7656dec5b29656edb7bc586e597  # v1.10.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ── 3. Publication réelle sur PyPI — gated by Environment protection ──────
  # Ce job est bloqué tant que l'environnement GitHub `pypi-publish`
  # (Settings → Environments → required reviewers) n'approuve pas manuellement.
  publish:
    name: Publication PyPI (après approbation)
    needs: [build-and-test, testpypi]
    runs-on: ubuntu-24.04
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write   # indispensable au trusted publishing (OIDC)
      actions: read     # requis par les environements proteges (approbation manuelle)
    steps:
      - name: Checkout du tag (build local, remplace le transit d'artefacts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Reconstruire les distributions localement (bit-identiques)
        run: |
          pip install --quiet "build==1.3.0" "twine==6.2.0"
          rm -rf dist/
          python -m build
          # Vérification d'intégrité AVANT publication : le wheel doit contenir
          # une METADATA valide (Name/Version). twine check est l'outil de référence.
          twine check dist/*
          python - <<'PYCHK'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          meta = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".dist-info/METADATA")]
          assert meta, f"METADATA absente dans {whl}"
          head = zipfile.ZipFile(whl).read(meta[0])[:120].decode()
          assert "Name:" in head and "Version:" in head, f"METADATA invalide: {head!r}"
          print("Integrite OK:", whl)
          PYCHK
          ls -la dist/

      - name: Publier sur PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@f7600683efdcb7656dec5b29656edb7bc586e597  # v1.10.3
        with: {}

  # ── 4. Publier le brouillon de release (ou le laisser visible si PyPI désactivé)
  github-release-publish:
    name: Publier la GitHub Release
    needs: [build-and-test, github-release-draft, publish]
    # always() : on veut publier la release même si les jobs PyPI ont été sautés
    # (cas où ENABLE_PYPI_PUBLISH n'est pas encore activé).
    if: always() && needs.build-and-test.result == 'success' && needs.github-release-draft.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publier le brouillon créé plus tôt
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090  # v2.4.1
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: true
          draft: false
