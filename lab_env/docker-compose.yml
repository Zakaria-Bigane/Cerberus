version: '3.8'

services:
  # Cible 1 : API REST Vulnérable (OpenAPI)
  vapi:
    image: roottusk/vapi:latest
    ports:
      - "8081:80"
    container_name: lab_rest_vapi
    environment:
      - VAPI_BASE_URI=http://localhost:8081

  # Cible 2 : API GraphQL Vulnérable
  dvga:
    image: dolevf/dvga:latest
    ports:
      - "5013:5013"
    container_name: lab_graphql_dvga
    environment:
      - WEB_HOST=0.0.0.0